<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Princess Memory Game 👑</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #ffd6e7 0%, #ffe8f5 30%, #d4f0ff 70%, #c8f7e8 100%);
      font-family: 'Nunito', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    h1 {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(28px, 6vw, 52px);
      color: #b44ac0;
      text-shadow: 3px 3px 0 #ffd6f9, 5px 5px 0 rgba(180,74,192,0.2);
      margin-bottom: 6px;
      text-align: center;
    }

    .subtitle {
      font-size: clamp(14px, 3vw, 18px);
      color: #8a5ca8;
      margin-bottom: 16px;
      text-align: center;
      font-weight: 700;
    }

    .stats {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .stat-box {
      background: white;
      border-radius: 20px;
      padding: 8px 20px;
      font-size: 18px;
      font-weight: 800;
      color: #5c3d7a;
      box-shadow: 0 4px 12px rgba(180,74,192,0.2);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      max-width: 900px;
      width: 100%;
    }

    @media (max-width: 720px) {
      .grid { grid-template-columns: repeat(4, 1fr); gap: 8px; }
    }
    @media (max-width: 440px) {
      .grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }
    }

    /* ── Card ── */
    .card-wrap {
      perspective: 800px;
      aspect-ratio: 3/4;
      cursor: pointer;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.45s cubic-bezier(0.4, 0.2, 0.2, 1);
      border-radius: 16px;
    }

    .card.flipped { transform: rotateY(180deg); }

    .card.matched {
      animation: matchPop 0.5s ease forwards;
    }

    @keyframes matchPop {
      0%   { transform: rotateY(180deg) scale(1); }
      40%  { transform: rotateY(180deg) scale(1.12); }
      70%  { transform: rotateY(180deg) scale(0.95); }
      100% { transform: rotateY(180deg) scale(1); }
    }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    }

    /* Card Back */
    .card-back {
      background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 50%, #6c3483 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 4px;
    }

    .card-back-inner {
      width: 85%;
      height: 85%;
      border: 3px dashed rgba(255,255,255,0.4);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(28px, 5vw, 42px);
    }

    /* Card Front */
    .card-front {
      transform: rotateY(180deg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 8px;
    }

    .card-front svg {
      width: 100%;
      flex: 1;
      min-height: 0;
    }

    .card-name {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(11px, 2vw, 16px);
      text-align: center;
      line-height: 1.1;
      padding: 0 4px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.15);
    }

    /* matched overlay */
    .card-front.matched-glow {
      box-shadow: 0 0 0 4px #ffd700, 0 0 20px #ffd700;
    }

    /* Mila rainbow glow */
    .card-front.mila-matched-glow {
      animation: rainbowGlow 1.4s infinite;
    }
    @keyframes rainbowGlow {
      0%   { box-shadow: 0 0 0 5px #ff6b9d, 0 0 22px #ff6b9d; }
      20%  { box-shadow: 0 0 0 5px #ff9f43, 0 0 22px #ff9f43; }
      40%  { box-shadow: 0 0 0 5px #f9ca24, 0 0 22px #f9ca24; }
      60%  { box-shadow: 0 0 0 5px #6ab04c, 0 0 22px #6ab04c; }
      80%  { box-shadow: 0 0 0 5px #48dbfb, 0 0 22px #48dbfb; }
      100% { box-shadow: 0 0 0 5px #ff6b9d, 0 0 22px #ff6b9d; }
    }

    /* ── Mila Special Overlay ──────────────────────────────── */
    .mila-special {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 150;
      align-items: center;
      justify-content: center;
      padding: 30px;
      background: linear-gradient(135deg, #ff6b9d, #ff9f43, #f9ca24, #6ab04c, #48dbfb, #c44569, #ff6b9d);
      background-size: 400% 400%;
      animation: rainbowShift 2.5s linear infinite;
    }
    .mila-special.show { display: flex; }

    @keyframes rainbowShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .mila-special-card {
      background: rgba(255,255,255,0.93);
      border-radius: 32px;
      padding: clamp(24px,5vw,44px) clamp(28px,6vw,56px);
      text-align: center;
      box-shadow: 0 0 0 6px rgba(255,255,255,0.5), 0 24px 60px rgba(0,0,0,0.25);
      animation: popIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
      max-width: 480px;
      width: 100%;
    }
    @keyframes popIn {
      from { transform: scale(0.4) rotate(-8deg); opacity: 0; }
      to   { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .mila-spin { font-size: clamp(44px,10vw,72px); display: inline-block; animation: mila-spin 1.5s linear infinite; }
    @keyframes mila-spin { to { transform: rotate(360deg); } }

    .mila-special-title {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(48px, 14vw, 90px);
      line-height: 1;
      background: linear-gradient(90deg, #ff6b9d 0%, #ff9f43 25%, #f9ca24 50%, #6ab04c 75%, #48dbfb 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: titleBounce 0.6s ease infinite alternate;
      margin: 8px 0;
    }
    @keyframes titleBounce {
      from { transform: scale(1); }
      to   { transform: scale(1.06); }
    }

    .mila-special-sub {
      font-size: clamp(17px, 4vw, 24px);
      font-weight: 800;
      color: #6b3d9a;
      margin-bottom: 6px;
    }
    .mila-special-stars { font-size: clamp(24px, 6vw, 40px); margin: 6px 0 18px; }

    .mila-keep-playing {
      background: linear-gradient(135deg, #ff6b9d, #c44569);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 13px 34px;
      font-family: 'Fredoka One', cursive;
      font-size: clamp(18px, 4vw, 24px);
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(196,69,105,0.4);
      transition: transform 0.15s;
    }
    .mila-keep-playing:hover { transform: scale(1.06); }

    /* ── Win Screen ── */
    .win-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(80,20,100,0.85);
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 20px;
      text-align: center;
      padding: 30px;
    }

    .win-screen.show { display: flex; }

    .win-title {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(36px, 10vw, 72px);
      color: #ffd700;
      text-shadow: 4px 4px 0 #ff6b35, 8px 8px 0 rgba(255,107,53,0.3);
      animation: wiggle 0.5s infinite alternate;
    }

    @keyframes wiggle {
      from { transform: rotate(-3deg) scale(1); }
      to   { transform: rotate(3deg) scale(1.05); }
    }

    .win-emoji { font-size: clamp(48px, 12vw, 96px); }
    .win-msg {
      font-size: clamp(18px, 4vw, 28px);
      color: white;
      font-weight: 800;
    }

    .play-again {
      background: linear-gradient(135deg, #ff6b9d, #ff3d7f);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 16px 40px;
      font-family: 'Fredoka One', cursive;
      font-size: clamp(20px, 4vw, 28px);
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255,61,127,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .play-again:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 28px rgba(255,61,127,0.5);
    }

    /* ── Confetti Canvas ── */
    #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 99; }

    /* Locked state */
    .card-wrap.locked { cursor: default; }
  </style>
</head>
<body>

  <div class="win-msg">Amazing job! You found all the princesses! 👑</div>
  <button class="play-again" onclick="initGame()">Play Again! 🎮</button>

    <button class="mila-keep-playing" onclick="dismissMilaSpecial()">Keep Playing! 🎮</button>

</div>

<canvas id="confetti"></canvas>

// ── Game State ───────────────────────────────────────────────────────────────

let cards = [];
let flipped = [];
let matched = 0;
let tries = 0;
let locked = false;

function initGame() {
  document.getElementById('winScreen').classList.remove('show');
  document.getElementById('totalCount').textContent = characters.length;
  matched = 0;
  tries = 0;
  flipped = [];
  locked = false;
  updateStats();
  stopConfetti();

  // Duplicate & shuffle
  cards = [...characters, ...characters]
    .map((c, i) => ({ ...c, uid: i }))
    .sort(() => Math.random() - 0.5);

  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  cards.forEach((card, idx) => {
    const wrap = document.createElement('div');
    wrap.className = 'card-wrap';
    wrap.dataset.idx = idx;
    wrap.innerHTML = `
      <div class="card" id="card-${idx}">
        <div class="card-face card-back">
          <div class="card-back-inner">✨</div>
        </div>
        <div class="card-face card-front" id="front-${idx}" style="background: linear-gradient(135deg, ${card.bg[0]}, ${card.bg[1]})">
          <svg viewBox="0 0 120 150" xmlns="http://www.w3.org/2000/svg">${card.svg}</svg>
          <div class="card-name" style="color:${card.nameColor}">${card.name}</div>
        </div>
      </div>
    `;
    wrap.addEventListener('click', () => flipCard(idx));
    grid.appendChild(wrap);
  });
}

function flipCard(idx) {
  if (locked) return;
  const card = cards[idx];
  const el = document.getElementById(`card-${idx}`);
  const wrap = el.parentElement;

  if (el.classList.contains('flipped') || el.classList.contains('matched')) return;
  if (flipped.length === 2) return;

  el.classList.add('flipped');
  flipped.push({ idx, id: card.id });

  if (flipped.length === 2) {
    tries++;
    updateStats();
    locked = true;

    if (flipped[0].id === flipped[1].id) {
      // Match!
      const matchedId = flipped[0].id;
      const matchTry = tries;
      matched++;
      updateStats();
      setTimeout(() => {
        flipped.forEach(f => {
          const c = document.getElementById(`card-${f.idx}`);
          c.classList.add('matched');
          const glowClass = matchedId === 'mila' ? 'mila-matched-glow' : 'matched-glow';
          document.getElementById(`front-${f.idx}`).classList.add(glowClass);
          c.parentElement.classList.add('locked');
        });
        flipped = [];
        locked = false;
        if (matchedId === 'mila' && matchTry <= 3) {
          showMilaSpecial(); // win screen (if last pair) fires after dismiss
        } else if (matched === characters.length) {
          showWin();
        }
      }, 400);
    } else {
      // No match — flip back
      setTimeout(() => {
        flipped.forEach(f => {
          document.getElementById(`card-${f.idx}`).classList.remove('flipped');
        });
        flipped = [];
        locked = false;
      }, 1000);
    }
  }
}

function updateStats() {
  document.getElementById('matchCount').textContent = matched;
  document.getElementById('tryCount').textContent = tries;
}

function showMilaSpecial() {
  locked = true;
  document.getElementById('milaSpecial').classList.add('show');
  startRainbowConfetti();
  // Auto-dismiss after 5 seconds
  window._milaDismissTimer = setTimeout(dismissMilaSpecial, 5000);
}

function dismissMilaSpecial() {
  clearTimeout(window._milaDismissTimer);
  const overlay = document.getElementById('milaSpecial');
  overlay.classList.remove('show');
  locked = false;
  // If it was also the last pair, show the win screen now
  if (matched === characters.length) {
    setTimeout(showWin, 400);
  } else {
    setTimeout(stopConfetti, 1500);
  }
}

function showWin() {
  setTimeout(() => {
    document.getElementById('winScreen').classList.add('show');
    startConfetti();
  }, 500);
}

// ── Confetti ─────────────────────────────────────────────────────────────────

let confettiAnim = null;
const canvas = document.getElementById('confetti');
const ctx = canvas.getContext('2d');
let particles = [];

const COLORS = ['#ff6b9d','#ffd700','#7ec8e3','#a8f0c8','#ff9ec4','#b39ddb','#80deea'];
const RAINBOW_COLORS = ['#ff6b9d','#ff9f43','#f9ca24','#6ab04c','#48dbfb','#c44569','#e040fb','#ffd700','#ff6b6b','#40c4ff'];

function startRainbowConfetti() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  particles = Array.from({ length: 220 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height - canvas.height,
    r: 6 + Math.random() * 10,
    d: 1.5 + Math.random() * 3.5,
    color: RAINBOW_COLORS[Math.floor(Math.random() * RAINBOW_COLORS.length)],
    tilt: Math.random() * 10 - 5,
    tiltAngle: 0,
    tiltSpeed: 0.06 + Math.random() * 0.08,
    shape: ['circle','rect','star'][Math.floor(Math.random() * 3)],
  }));
  animateConfetti();
}

function startConfetti() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  particles = Array.from({ length: 120 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height - canvas.height,
    r: 5 + Math.random() * 8,
    d: 2 + Math.random() * 3,
    color: COLORS[Math.floor(Math.random() * COLORS.length)],
    tilt: Math.random() * 10 - 5,
    tiltAngle: 0,
    tiltSpeed: 0.08 + Math.random() * 0.06,
    shape: Math.random() > 0.5 ? 'circle' : 'rect',
  }));
  animateConfetti();
}

function animateConfetti() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate((p.tiltAngle * Math.PI) / 180);
    ctx.fillStyle = p.color;
    if (p.shape === 'circle') {
      ctx.beginPath();
      ctx.arc(0, 0, p.r, 0, Math.PI * 2);
      ctx.fill();
    } else if (p.shape === 'star') {
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const a = (i * 4 * Math.PI) / 5 - Math.PI / 2;
        const b = (i * 4 * Math.PI) / 5 + (2 * Math.PI) / 5 - Math.PI / 2;
        i === 0 ? ctx.moveTo(Math.cos(a)*p.r, Math.sin(a)*p.r) : ctx.lineTo(Math.cos(a)*p.r, Math.sin(a)*p.r);
        ctx.lineTo(Math.cos(b)*p.r*0.4, Math.sin(b)*p.r*0.4);
      }
      ctx.closePath(); ctx.fill();
    } else {
      ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 0.6);
    }
    ctx.restore();
    p.y += p.d;
    p.tiltAngle += p.tiltSpeed;
    p.x += Math.sin(p.tiltAngle) * 1.5;
    if (p.y > canvas.height) {
      p.y = -10;
      p.x = Math.random() * canvas.width;
    }
  });
  confettiAnim = requestAnimationFrame(animateConfetti);
}

function stopConfetti() {
  if (confettiAnim) { cancelAnimationFrame(confettiAnim); confettiAnim = null; }
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

// ── Init ─────────────────────────────────────────────────────────────────────

window.addEventListener('resize', () => {
  if (confettiAnim) { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
});

initGame();
</script>
